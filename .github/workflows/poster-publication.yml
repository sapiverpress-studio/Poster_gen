name: Approved poster publication
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: sapiver-poster-publication
  cancel-in-progress: false
jobs:
  worker:
    if: github.repository == 'sapiverpress-studio/Poster_gen' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canva-oauth-callback
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect private approved tasks using signed GitHub identity
        env:
          POSTER_SITE_ORIGIN: https://sapiver-poster-gen-auth.netlify.app
          ETSY_PRINTS_KEYSTRING: ${{ secrets.ETSY_PRINTS_KEYSTRING }}
          ETSY_PRINTS_SHARED_SECRET: ${{ secrets.ETSY_PRINTS_SHARED_SECRET }}
          SHRIMP_APIKEY: ${{ secrets.SHRIMP_APIKEY }}
        run: node scripts/github-publication.mjs

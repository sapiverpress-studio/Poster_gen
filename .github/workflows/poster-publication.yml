name: Approved poster publication
on:
  workflow_dispatch:
    inputs:
      seo_mode:
        description: 'Scoped Etsy SEO job: audit, 3-listing pilot, or approved batch'
        type: choice
        required: false
        default: 'none'
        options:
          - none
          - audit
          - pilot
          - apply
          - altprobe
          - altinspect
          - altwrite
permissions:
  contents: read
  id-token: write
concurrency:
  group: sapiver-poster-publication
  cancel-in-progress: false
jobs:
  worker:
    if: github.repository == 'sapiverpress-studio/Poster_gen' && github.ref == 'refs/heads/main' && (inputs.seo_mode == 'none' || inputs.seo_mode == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/canva-oauth-callback
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect private approved tasks using signed GitHub identity
        env:
          POSTER_SITE_ORIGIN: ${{ format('https://{0}', 'sapiver-poster-gen-auth.netlify.app') }}
          ETSY_PRINTS_KEYSTRING: ${{ secrets.ETSY_PRINTS_KEYSTRING }}
          ETSY_PRINTS_SHARED_SECRET: ${{ secrets.ETSY_PRINTS_SHARED_SECRET }}
          SHRIMP_APIKEY: ${{ secrets.SHRIMP_APIKEY }}
          POSTER_INTERNATIONAL_SHIPPING_ENABLED: 'true'
          POSTER_REQUIRED_SHIPPING_PROFILE_ID: '319546214912'
          POSTER_INTERNATIONAL_MIGRATION_ENABLED: 'true'
        run: node scripts/github-publication.mjs

  seo_audit:
    if: github.repository == 'sapiverpress-studio/Poster_gen' && github.ref == 'refs/heads/main' && inputs.seo_mode == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feature/canva-oauth-callback
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Snapshot active Etsy listing metadata in private site store; no seller writes
        env:
          POSTER_SITE_ORIGIN: https://sapiver-poster-gen-auth.netlify.app
          ETSY_PRINTS_KEYSTRING: ${{ secrets.ETSY_PRINTS_KEYSTRING }}
          ETSY_PRINTS_SHARED_SECRET: ${{ secrets.ETSY_PRINTS_SHARED_SECRET }}
        run: node ops/seo-ops/etsy-seo-readonly.mjs

  seo_apply:
    if: github.repository == 'sapiverpress-studio/Poster_gen' && github.ref == 'refs/heads/main' && (inputs.seo_mode == 'pilot' || inputs.seo_mode == 'apply')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feature/canva-oauth-callback
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply strictly tags-only Etsy SEO, verify stock SKUs and galleries
        env:
          SEO_APPLY_MODE: ${{ inputs.seo_mode }}
          POSTER_SITE_ORIGIN: https://sapiver-poster-gen-auth.netlify.app
          ETSY_PRINTS_KEYSTRING: ${{ secrets.ETSY_PRINTS_KEYSTRING }}
          ETSY_PRINTS_SHARED_SECRET: ${{ secrets.ETSY_PRINTS_SHARED_SECRET }}
        run: node ops/seo-ops/etsy-seo-apply.mjs

  alt_capability_probe:
    if: github.repository == 'sapiverpress-studio/Poster_gen' && github.ref == 'refs/heads/main' && (inputs.seo_mode == 'altprobe' || inputs.seo_mode == 'altinspect')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feature/canva-oauth-callback
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Re-association capability check, existing photo ID and unchanged alt text
        env:
          ALT_PROBE_MODE: ${{ inputs.seo_mode == 'altinspect' && 'inspect' || 'idempotent' }}
          POSTER_SITE_ORIGIN: https://sapiver-poster-gen-auth.netlify.app
          ETSY_PRINTS_KEYSTRING: ${{ secrets.ETSY_PRINTS_KEYSTRING }}
          ETSY_PRINTS_SHARED_SECRET: ${{ secrets.ETSY_PRINTS_SHARED_SECRET }}
        run: node ops/seo-ops/etsy-alt-capability-probe.mjs

  alt_single_write:
    if: github.repository == 'sapiverpress-studio/Poster_gen' && github.ref == 'refs/heads/main' && inputs.seo_mode == 'altwrite'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feature/canva-oauth-callback
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply one missing alt text to same image ID and rank, verify no changes to stock or gallery
        env:
          ALT_WRITE_MODE: single
          POSTER_SITE_ORIGIN: https://sapiver-poster-gen-auth.netlify.app
          ETSY_PRINTS_KEYSTRING: ${{ secrets.ETSY_PRINTS_KEYSTRING }}
          ETSY_PRINTS_SHARED_SECRET: ${{ secrets.ETSY_PRINTS_SHARED_SECRET }}
        run: node ops/seo-ops/etsy-alt-single-apply.mjs

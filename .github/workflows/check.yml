name: Verify Poster_gen
on:
  push:
    branches: ["feature/canva-oauth-callback", "docs/handover-and-change-policy-20261008"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check netlify/functions/canva-oauth.mjs
      - run: node --check lib/oauth.mjs
      - run: node --check lib/approved-export.mjs
      - run: node --check netlify/functions/canva-auto-approved.mjs
      - run: node --check netlify/functions/canva-approved-report.mjs
      - run: npm test

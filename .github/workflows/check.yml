name: Verify Poster_gen
on:
  push:
    branches: ["feature/canva-oauth-callback", "docs/handover-and-change-policy-20261008"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check netlify/functions/canva-oauth.mjs
      - run: node --check lib/oauth.mjs
      - run: node --check lib/approved-export.mjs
      - run: node --check netlify/functions/canva-auto-approved.mjs
      - run: node --check netlify/functions/canva-approved-report.mjs
      - run: node --check lib/etsy-oauth.mjs
      - run: node --check netlify/functions/etsy-oauth.mjs
      - run: node --check lib/printshrimp-api.mjs
      - run: node --check lib/master-stream.mjs
      - run: node --check netlify/edge-functions/print-master.js
      - run: npm ci --ignore-scripts
      - run: node --check lib/etsy-session.mjs
      - run: node --check lib/etsy-draft.mjs
      - run: node --check lib/poster-workflow.mjs
      - run: node --check netlify/functions/poster-workflow.mjs
      - run: node --check netlify/functions/poster-runner.mjs
      - run: node -e "Promise.all(['./netlify/functions/poster-workflow.mjs','./netlify/functions/poster-runner.mjs','./netlify/edge-functions/print-master.js'].map(p=>import(p)))"
      - run: node --check lib/poster-template.mjs
      - run: node --check lib/uploaded-poster.mjs
      - run: node --check lib/poster-upload-web.mjs
      - run: node --check lib/poster-upload-runner.mjs
      - run: node --check public/poster-upload.mjs
      - run: node -e "Promise.all(['./netlify/functions/poster-upload.mjs','./netlify/functions/poster-upload-runner.mjs','./netlify/edge-functions/uploaded-master.js'].map(p=>import(p)))"
      - run: node --check scripts/github-publication.mjs
      - run: node -e "import('./netlify/functions/github-worker.mjs')"
      - run: npm test

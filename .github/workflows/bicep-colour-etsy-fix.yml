name: One-time Bicep Heart Etsy colour correction

on:
  pull_request:
    paths:
      - 'seo-ops/bicep-colour-reconcile.mjs'
      - 'seo-ops/bicep-colour-reconcile.test.mjs'
      - '.github/workflows/bicep-colour-etsy-fix.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bicep-colour-etsy-fix.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: sapiver-poster-publication
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feature/canva-oauth-callback
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test exact seller IDs and protected field guards
        run: |
          node --check ops/seo-ops/bicep-colour-reconcile.mjs
          node --test ops/seo-ops/bicep-colour-reconcile.test.mjs

  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feature/canva-oauth-callback
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact Etsy and PrintShrimp references, do not alter listings
        env:
          BICEP_COLOUR_MODE: audit
          ETSY_PRINTS_KEYSTRING: ${{ secrets.ETSY_PRINTS_KEYSTRING }}
          ETSY_PRINTS_SHARED_SECRET: ${{ secrets.ETSY_PRINTS_SHARED_SECRET }}
          SHRIMP_APIKEY: ${{ secrets.SHRIMP_APIKEY }}
        run: node ops/seo-ops/bicep-colour-reconcile.mjs

name: One-time Etsy alt four-photo verified batch launcher
# Retry after distinguishing previously-approved tag changes from immutable fulfilment fields.
on:
  push:
    paths:
      - '.github/workflows/etsy-alt-probe-launch.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.repository == 'sapiverpress-studio/Poster_gen' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run guarded four-image existing-photo backfill after successful 12-image pilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main","inputs":{"seo_mode":"altfour"}}' \
            https://api.github.com/repos/sapiverpress-studio/Poster_gen/actions/workflows/poster-publication.yml/dispatches

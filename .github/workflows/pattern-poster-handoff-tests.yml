name: Pattern receiver handoff tests
on:
  push:
    branches: [feature/pattern-handoff-parity-20261011]
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check public/poster-upload.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
